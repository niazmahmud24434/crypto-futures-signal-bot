[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-futures-signal-bot"
version = "0.1.0"
description = "Manual-only Binance Futures signal engine with Telegram alerts."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Md. Meshkat Talukdar" }]
dependencies = [
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "python-dotenv>=1.0,<2",
  "python-telegram-bot>=22,<23",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
